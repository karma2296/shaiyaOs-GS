
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaiya OS - GS Application Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Metamorphous&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --shaiya-gold: #c5a059;
      --shaiya-blue: #1e3a8a;
      --shaiya-glow: rgba(197, 160, 89, 0.3);
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050507;
      color: #e2e8f0;
      overflow-x: hidden;
    }
    .font-fantasy {
      font-family: 'Cinzel Decorative', cursive;
    }
    .font-gothic {
      font-family: 'Metamorphous', serif;
    }
    .bg-shaiya-gradient {
      background: radial-gradient(circle at top center, #101018 0%, #050507 100%);
      background-attachment: fixed;
    }
    .glass-morphism {
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(197, 160, 89, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
    }
    .shaiya-border {
      border: 1px solid var(--shaiya-gold);
      position: relative;
    }
    .shaiya-border::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border: 1px solid rgba(197, 160, 89, 0.3);
      pointer-events: none;
    }
    .gold-text {
      color: var(--shaiya-gold);
      text-shadow: 0 0 10px var(--shaiya-glow);
    }
    .btn-shaiya {
      background: linear-gradient(135deg, #1a1a1a 0%, #000 100%);
      border: 1px solid var(--shaiya-gold);
      color: var(--shaiya-gold);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: all 0.3s ease;
    }
    .btn-shaiya:hover {
      background: var(--shaiya-gold);
      color: #000;
      box-shadow: 0 0 20px var(--shaiya-glow);
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #050507;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--shaiya-gold);
      border-radius: 10px;
    }
    .pulse-gold {
      animation: pulse-gold 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-gold {
      0%, 100% { opacity: 1; }
      50% { opacity: .3; }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.45.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-shaiya-gradient min-h-screen">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
